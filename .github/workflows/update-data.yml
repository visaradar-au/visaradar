name: Update data and deploy

on:
  schedule:
    - cron: '*/30 * * * *'   # news (polite: ETag, sitemaps, crawl delays)
    - cron: '7 * * * *'      # state program pages, rounds, lists (~70 s of crawl delays), data.gov.au datasets
    - cron: '23 */6 * * *'   # SkillSelect reload check (pulls only when the dashboard reloads)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One source group per scheduled run, so crawl delays are never squeezed together.
      - name: News
        if: github.event.schedule == '*/30 * * * *' || github.event_name != 'schedule'
        run: npm run pipeline:news
        continue-on-error: true
      - name: State programs, rounds, occupation lists
        if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
        run: npm run pipeline:states
        continue-on-error: true
      - name: Home Affairs datasets (data.gov.au)
        if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
        run: npm run pipeline:datasets
        continue-on-error: true
      - name: SkillSelect EOI data
        if: github.event.schedule == '23 */6 * * *' || github.event_name == 'workflow_dispatch'
        run: node pipeline/skillselect.mjs
        continue-on-error: true
      # fetch-state.json changes on every run (timestamps), so it alone doesn't count as a change.
      - name: Detect data changes
        id: commit
        run: |
          git add data
          if git diff --cached --quiet -- data ':!data/news/fetch-state.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run test:pipeline && npm run test:unit && npm run build
      # Push only after tests and the build pass, so bad data never reaches main.
      - name: Commit and push data
        if: steps.commit.outputs.changed == 'true'
        run: |
          git config user.name "visaradar-bot"
          git config user.email "visaradar-bot@users.noreply.github.com"
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: dist
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
